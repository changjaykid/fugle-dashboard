<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="台股：今天掛單買什麼、模擬帳戶與資料狀態。">
<title>台股 Stock Radar｜今天買什麼</title>
<link rel="stylesheet" href="radar.css?v=44f2d4eacd0f"><script src="radar.js?v=9a86bc731e95" defer></script>
</head>
<body>
<header class="masthead"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">R</span><span>STOCK RADAR<small>台股・開盤前決策</small></span></a><div class="header-end"><a class="quiet" href="https://discord.com/channels/1492215198549807134/1493898877970153532" target="_blank" rel="noopener">開啟股票通知 ↗</a><span id="market-date">台北時間</span><button id="refresh" class="quiet">重新整理 <span aria-hidden="true">↻</span></button></div></header>
<div id="lock" class="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <form id="lock-form" class="lock-card" autocomplete="off">
    <h1 id="lock-title">STOCK RADAR</h1>
    <p class="lock-note">這個頁面的資料是加密的。輸入密碼才會解開。</p>
    <label class="lock-field"><span class="sr-only">密碼</span>
      <input id="lock-input" type="password" inputmode="numeric" placeholder="密碼" aria-describedby="lock-hint" autocomplete="new-password" autofocus>
    </label>
    <p id="lock-hint" class="lock-hint">提示：老梗</p>
    <button type="submit" id="lock-go">解鎖</button>
    <p id="lock-error" class="lock-error" role="alert" hidden></p>
  </form>
</div>
<main hidden>
<section class="intro"><div class="scan-stamp"><span class="dot" aria-hidden="true"></span><span id="last-scan">正在讀取掃描結果</span></div></section>
<div id="notice" class="notice" role="status" aria-live="polite">正在讀取資料…</div>
<section id="scan-section" class="system-section" aria-labelledby="scan-title" hidden><div class="section-top"><div><h2 id="scan-title">今天買什麼</h2></div><span id="scan-stamp" class="muted"></span></div><div id="scan-picks"></div><div id="scan-near"></div><p id="scan-tally" class="muted"></p></section>
<section id="paper-section" class="system-section" aria-labelledby="paper-title" hidden><div class="section-top"><div><h2 id="paper-title">模擬帳戶</h2></div><span id="paper-stamp" class="muted"></span></div><div id="paper-head" class="paper-head"></div><div id="paper-stats" class="stats"></div><div id="paper-open"></div><div id="paper-orders"></div><div id="paper-closed"></div><p id="paper-note" class="muted"></p></section>
<section class="system-section" aria-labelledby="system-title"><div class="section-top"><div><h2 id="system-title">資料狀態</h2></div><span id="coverage" class="muted"></span></div><div id="health" class="health-grid"></div></section>
</main>
<p class="attribution">資料來源：金融監督管理委員會證券期貨局／臺灣證券交易所，2026 年個股日成交資訊。依 <a href="https://data.gov.tw/license" target="_blank" rel="noopener">政府資料開放授權條款第 1 版</a> 使用；<a href="https://data.gov.tw/dataset/11549" target="_blank" rel="noopener">資料集說明</a>。盤前試撮與公開收盤資料分開。</p>
<footer><span>STOCK RADAR / 台股與 ETF</span><span>資料有缺口時，先等確認。</span></footer>
<noscript>請啟用 JavaScript 以查看股票雷達。</noscript>
</body></html>
